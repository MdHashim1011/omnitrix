<title id="t">How a task finds its model</title><desc id="d">A task comes in with a type and a privacy level. omnitrix drops accounts that cannot take it, scores the rest on skill fit, quota left, cost and past results, then sends it to the best one and keeps the next two as fallbacks.</desc>
