<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 684" width="960" height="684" role="img" aria-labelledby="t d">
<title id="t">omnitrix at work</title>
<desc id="d">An example job, &quot;add rate limiting to the public API&quot;, split by Claude into six tasks in two rounds. First, Gemini reads the exported issues, Codex writes the middleware on its own git branch, Groq drafts the changelog and a local Ollama model checks the .env file for leaked keys. Then DeepSeek reviews the middleware diff, and the edge-case task moves to GLM because Kimi is rate limited. Claude checks each result and merges the accepted branch.</desc>
<style>svg{--bg:#f6f6f3;--surface:#ffffff;--tile:#efeee9;--line:#e3e2dc;--line-strong:#d0cfc8;--ink:#141413;--ink2:#4d4c48;--ink3:#66655f;--accent:#2563c9;--accent-bg:#e6eefb;--track:#e7e6e0;--ok:#1b6f35;--ok-bg:#e3f2e7;--warn:#8a5a00;--warn-bg:#fbf0d4;--bad:#b42323;--bad-bg:#fbe7e7}@media (prefers-reduced-motion:reduce){.dot{display:none}}</style>
<rect x="0.5" y="0.5" width="959" height="683" rx="20" fill="var(--bg)" stroke="var(--line)"/>
<text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="0.01em" font-weight="600" fill="var(--ink3)">Example: one job, six tasks</text><text x="40" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="-0.02em" font-weight="650" fill="var(--ink)">Add rate limiting to the public API</text><text x="300" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="0.01em" font-weight="600" fill="var(--ink3)">Round 1, sent together</text><text x="300" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="0.01em" font-weight="600" fill="var(--ink3)">Round 2, once the middleware is written</text><text x="724" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="0.01em" font-weight="600" fill="var(--ink3)">omnitrix sends it to</text><rect x="40" y="298" width="196" height="132" rx="16" fill="var(--surface)" stroke="var(--line)"/><text x="62" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" letter-spacing="-0.02em" font-weight="650" fill="var(--ink)">Claude</text><text x="62" y="364" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="var(--ink2)">Splits the job into</text><text x="62" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="var(--ink2)">tasks and reviews</text><text x="62" y="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="var(--ink2)">every result</text><path d="M236,364 C280,3